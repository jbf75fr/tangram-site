# Refabrique le site (dossier public/) à chaque modification de la maquette sur main,
# puis enregistre le résultat : Vercel met alors le site en ligne.
# Permet de corriger un texte directement sur GitHub (dossier maquette/), sans autre étape.
name: Fabriquer le site

on:
  push:
    branches: [main]
    paths: ['maquette/**', 'outils/**', 'ressources/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construire
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Installer Pillow
        run: python3 -m venv /tmp/env && /tmp/env/bin/pip install --quiet pillow
      - name: Fabriquer les pages
        run: /tmp/env/bin/python outils/construire.py
      - name: Enregistrer le site fabriqué
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "Rien n'a changé dans le site."
          else
            git commit -q -m "Site refabriqué à partir de la maquette"
            git push
          fi
